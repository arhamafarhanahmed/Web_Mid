<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simple Calculator</title>

<style>
  body{
    font-family: Arial;
    text-align: center;
    margin-top: 50px;
  }

  .box{
    width: 350px;
    margin: auto;
    border: 1px solid black;
    padding: 20px;
  }

  input{
    padding: 8px;
    margin: 5px;
    width: 120px;
  }

  button{
    padding: 8px 12px;
    margin: 5px;
    cursor: pointer;
  }

  .op{
    background: blue;
    color: white;
    border: none;
  }

  #result{
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="box">

  <h2>Simple Calculator</h2>

  <input type="number" id="num1" placeholder="Number 1">
  <input type="number" id="num2" placeholder="Number 2">

  <br>

  <button class="op" onclick="calc('+')">+</button>
  <button class="op" onclick="calc('-')">-</button>
  <button class="op" onclick="calc('*')">*</button>
  <button class="op" onclick="calc('/')">/</button>

  <h3 id="result"></h3>

</div>

<script>

function calc(op){

  let num1 = Number(document.getElementById("num1").value);
  let num2 = Number(document.getElementById("num2").value);
  let result = document.getElementById("result");

  if(isNaN(num1) || isNaN(num2)){
    result.innerHTML = "Please enter numbers";
    return;
  }

  let res;

  if(op === '+'){
    res = num1 + num2;
  }
  else if(op === '-'){
    res = num1 - num2;
  }
  else if(op === '*'){
    res = num1 * num2;
  }
  else if(op === '/'){
    res = num2 !== 0 ? num1 / num2 : "Cannot divide by 0";
  }

  result.innerHTML = "Result: " + res;
}

</script>

</body>
</html>
